name: mobile_automation_tool
description: >
  On-device Android automation tool. Drives the login flow of an allowlisted
  Flutter application through an AccessibilityService and produces a pass/fail
  checklist report. Runs entirely on the device: no Appium, no ADB, no host
  machine, no automation server.
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Credentials at rest (Android Keystore backed).
  flutter_secure_storage: ^9.2.4
  # Report storage location.
  path_provider: ^2.1.5
  # Android share sheet for exporting a report.
  share_plus: ^10.1.4
  intl: ^0.19.0
  # The report's HTML preview inside the app.
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
